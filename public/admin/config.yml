backend:
  name: github
  branch: master

media_folder: public/images
public_folder: /images

collections:
  - name: groups
    label: 小組
    folder: content/groups
    create: true
    fields:
      - { name: name, label: 名稱, widget: string }
      - { name: slug, label: Slug, widget: string }
      - { name: order, label: 排序, widget: number }
      - { name: active, label: 啟用, widget: boolean }
      - { name: tagline, label: 一句話介紹, widget: string }
      - { name: description, label: 說明, widget: text }
      - { name: color, label: 主色, widget: string }
      - name: recruit
        label: 招募
        widget: object
        fields:
          - { name: open, label: 開放中, widget: boolean }
          - { name: description, label: 招募說明, widget: text }

  - name: events
    label: 活動
    folder: content/events
    create: true
    fields:
      - { name: title, label: 標題, widget: string }
      - { name: date, label: 日期, widget: datetime }
      - { name: group, label: 小組, widget: select, options: [all, system, international, game, case] }
      - { name: type, label: 類型, widget: select, options: [招募, 演講, 競賽, 工作坊, 其他] }
      - { name: status, label: 狀態, widget: select, options: [upcoming, past] }
      - { name: location, label: 地點, widget: string, required: false }
      - { name: description, label: 簡介, widget: text }
      - { name: registration, label: 報名連結, widget: string, required: false }

  - name: members
    label: 幹部
    folder: content/members
    create: true
    fields:
      - { name: name, label: 姓名, widget: string }
      - { name: group, label: 小組, widget: select, options: [system, international, game, case] }
      - { name: role, label: 職稱, widget: string }
      - { name: year, label: 學年, widget: number }
      - { name: active, label: 當屆, widget: boolean }
      - name: contact
        label: 聯絡方式
        widget: object
        fields:
          - { name: github, label: GitHub, widget: string, required: false }
          - { name: instagram, label: Instagram, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }

  - name: showcase
    label: 成果展示
    folder: content/showcase
    create: true
    fields:
      - { name: title, label: 標題, widget: string }
      - { name: group, label: 小組, widget: select, options: [system, international, game, case] }
      - { name: date, label: 日期, widget: datetime }
      - { name: description, label: 簡介, widget: text }
      - { name: tags, label: 標籤, widget: list, required: false }
      - name: links
        label: 連結
        widget: list
        required: false
        fields:
          - { name: label, label: 名稱, widget: string }
          - { name: url, label: 網址, widget: string }